name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - connection: sqlite
            database: ":memory:"
          - connection: pgsql
            database: prism_testing
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: prism_testing
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism -d prism_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.connection }}
      DB_DATABASE: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: prism
      DB_PASSWORD: testing
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test
      - run: npm ci
      - run: npm run build
